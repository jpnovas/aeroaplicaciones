<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeroaplicaciones Pedreschi – Gestión (Firebase)</title>

  <!-- Bootstrap 5 (para UI rápida) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Firebase SDK (modular) -->
  <script type="module">
    // 1️⃣  Configuración de Firebase (¡REEMPLAZA con tus datos!)
    const firebaseConfig = {
  apiKey: "AIzaSyCaUk64cgZnSl0tu-vA5ag4RgjqegjK8VU",
  authDomain: "aeroaplicaciones-pedreschi.firebaseapp.com",
  projectId: "aeroaplicaciones-pedreschi",
  storageBucket: "aeroaplicaciones-pedreschi.firebasestorage.app",
  messagingSenderId: "328353696474",
  appId: "1:328353696474:web:59a1666ee8abb39741f3e3",
  measurementId: "G-L4HKQGLP0H"
};

    // 2️⃣  Inicializar Firestore
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 3️⃣  Referencias a colecciones (puedes crear más si lo deseas)
    const clientsCol = collection(db, "clients");
    const jobsCol   = collection(db, "jobs");
    const paymentsCol = collection(db, "payments");

    // 4️⃣  Funciones CRUD (simplificadas)
    async function addClient(client) {
      await addDoc(clientsCol, client);
    }

    async function addJob(job) {
      await addDoc(jobsCol, job);
    }

    async function addPayment(payment) {
      await addDoc(paymentsCol, payment);
    }

    // 5️⃣  Escuchar cambios en tiempo real (opcional, para UI reactiva)
    function subscribeJobs(callback) {
      return onSnapshot(
        query(jobsCol, orderBy("status")),
        (snapshot) => {
          const jobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          callback(jobs);
        }
      );
    }

    // 6️⃣  UI helpers (para mostrar datos en la consola o en la página)
    function log(msg) { console.log("[AeroPedreschi]", msg); }

    // 7️⃣  Inicializar la app cuando el DOM esté listo
    document.addEventListener("DOMContentLoaded", async () => {
      log("🚀 Iniciando aplicación con Firebase…");

      // ---- Ejemplo: crear un cliente de prueba (solo la primera vez) ----
      const sampleClient = {
        name: "Agropecuaria El Porvenir S.A.",
        cuit: "30-70987654-1",
        phone: "351-5551234",
        city: "Córdoba",
        contact: "Juan Pérez"
      };
      // Evita duplicados:
      const snap = await getDoc(doc(clientsCol, "client-001")); // <-- cambia el ID si quieres
      if (!snap.exists()) {
        await addClient(sampleClient);
        log("✅ Cliente de ejemplo creado");
      }

      // ---- Escuchar la lista de trabajos y mostrarlos en la tabla ----
      const jobsContainer = document.getElementById("jobs-table-body");
      const unsubJobs = subscribeJobs((jobs) => {
        jobsContainer.innerHTML = "";
        jobs.forEach(job => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${job.date || ""}</td>
            <td>${job.clientId || ""}</td>
            <td>${job.description || ""}</td>
            <td>${job.amount || 0}</td>
            <td>${job.status || "pendiente"}</td>
            <td>
              <button class="btn btn-sm btn-primary me-1" data-id="${job.id}" data-action="editar">Editar</button>
              <button class="btn btn-sm btn-danger" data-id="${job.id}" data-action="eliminar">Eliminar</button>
            </td>`;
          jobsContainer.appendChild(tr);
        });
      });

      // ---- Delegación de eventos para Editar / Eliminar ----
      document.getElementById("jobs-table-container").addEventListener("click", async (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const id = btn.dataset.id;
        const action = btn.dataset.action;

        if (action === "editar") {
          // Aquí podrías abrir un modal con un formulario pre‑rellenado.
          log("🔧 Editar trabajo " + id);
        }

        if (action === "eliminar") {
          if (confirm("¿Seguro que quieres eliminar este trabajo?")) {
            await deleteDoc(doc(jobsCol, id));
            log("🗑️ Trabajo eliminado " + id);
          }
        }
      });

      // ---- Formulario de creación de un nuevo trabajo ----
      const jobForm = document.getElementById("job-form");
      jobForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const job = {
          clientId: form.clientId.value,
          date: form.date.value,
          description: form.description.value,
          amount: parseFloat(form.amount.value),
          status: form.status.value,
          // Puedes añadir más campos (location, mapLink, etc.)
        };
        await addJob(job);
        log("✅ Trabajo creado");
        jobForm.reset();
      });
    });
  </script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Aeroaplicaciones Pedreschi</a>
    </div>
  </nav>

  <div class="container">

    <!-- ====================  LISTADO DE TRABAJOS  ==================== -->
    <h2 class="mb-4">Carga de Trabajos</h2>

    <form id="job-form" class="row g-3">
      <div class="col-md-6">
        <label for="clientId" class="form-label">Cliente</label>
        <select class="form-select" id="clientId" required>
          <option value="">Seleccionar cliente</option>
          <!-- Aquí podrías cargar la lista de clientes desde Firestore (onSnapshot) -->
        </select>
      </div>
      <div class="col-md-3">
        <label for="date" class="form-label">Fecha</label>
        <input type="date" class="form-control" id="date" required>
      </div>
      <div class="col-md-2">
        <label for="amount" class="form-label">Monto ($)</label>
        <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
      </div>
      <div class="col-md-3">
        <label for="status" class="form-label">Estado</label>
        <select class="form-select" id="status">
          <option value="pendiente">Pendiente</option>
          <option value="en-curso">En Ejecución</option>
          <option value="completado">Completado</option>
          <option value="listo-cobro">Listo para Cobrar</option>
          <option value="pagado">Cobrado</option>
        </select>
      </div>
      <div class="col-12">
        <label for="description" class="form-label">Descripción / Observaciones</label>
        <textarea class="form-control" id="description" rows="3" placeholder="Ej: Aeroaplicación de herbicida"></textarea>
      </div>
    </form>

    <hr class="my-4">

    <h4>Lista de Trabajos</h4>
    <div class="table-responsive">
      <table class="table table-striped table-hover" id="jobs-table">
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="jobs-table-body">
          <!-- Los datos se rellenan dinámicamente mediante Firestore -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS (opcional, solo si usas componentes como modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
